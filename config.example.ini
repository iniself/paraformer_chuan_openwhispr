# OpenWhispr Paraformer Shim configuration
#
# Copy this file to config.ini, then edit config.ini.
# Environment variables override values in config.ini.
#
# OpenWhispr Paraformer Shim 配置文件。
# 复制为 config.ini 后再修改；环境变量优先级高于本文件。

[server]
# Listen address / 监听地址
host = 127.0.0.1
# Listen port / 监听端口
port = 8765

[models]
# Recognition engine: paraformer | sense_voice
# 识别引擎：paraformer（川渝）或 sense_voice（中英日韩粤）
engine = paraformer

# Paraformer model directory / Paraformer 模型目录
paraformer_dir = ./sherpa-onnx-paraformer-zh-int8-2025-10-07
# Punctuation model directory / 标点模型目录
punctuation_dir = ./sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8
# CPU threads for inference / 推理线程数
num_threads = 2

# SenseVoice only / 仅 engine = sense_voice 时生效
# SenseVoice model directory / SenseVoice 模型目录
sense_voice_dir = ./sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
# auto | zh | en | ja | ko | yue
sense_voice_language = auto
# Add punctuation and normalize numbers inside SenseVoice
# SenseVoice 内部输出标点并把数字规范化
sense_voice_use_itn = true

# Standalone punctuation model: auto | always | never
# auto: skip it when SenseVoice already adds punctuation
# 独立标点模型：auto 表示 SenseVoice 自带标点时自动跳过
punctuation = auto

[english]
# Join English words split into single letters / 合并被拆成单字母的英文
# Mainly useful for the Paraformer engine / 主要对 Paraformer 有用
fix = true
# Custom word list; leave empty to use data/english_words.txt.gz
# 自定义词表；留空使用内置 data/english_words.txt.gz
words_path =
